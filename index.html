<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Jeff Winters Availability</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one row per weekday. A 9-to-5 timeline bar shows busy blocks, with the open windows listed under it. */
:root {
  --bg: #f6f8f8;
  --surface: #ffffff;
  --fg: #16222a;
  --muted: #5d6f78;
  --line: #dbe3e6;
  --free: #0b7a6b;
  --free-bg: #e2f3ef;
  --busy: #c5cfd4;
  --busy-line: #9aa9b0;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171b; --surface: #162329; --fg: #e5eef0; --muted: #93a6ae; --line: #26373e;
    --free: #5fd1bd; --free-bg: #12342f; --busy: #2b3c43; --busy-line: #4d646d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171b; --surface: #162329; --fg: #e5eef0; --muted: #93a6ae; --line: #26373e;
  --free: #5fd1bd; --free-bg: #12342f; --busy: #2b3c43; --busy-line: #4d646d;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.page { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 48px; }
header { display: flex; flex-direction: column; gap: 6px; margin-bottom: 28px; }
h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); font-weight: 600; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 60ch; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); margin-bottom: 24px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 18px; height: 10px; border-radius: 2px; display: inline-block; }
.sw.free { background: var(--free-bg); border: 1px solid var(--free); }
.sw.busy { background: var(--busy); border: 1px solid var(--busy-line); }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
.week { margin-bottom: 32px; }
.axis, .day { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); column-gap: 16px; }
.axis { margin-bottom: 4px; }
.ticks { position: relative; height: 16px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); }
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }
.days { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.day { padding: 12px 14px; border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; }
.dlabel { display: flex; flex-direction: column; }
.dlabel b { font-weight: 600; }
.dlabel small { color: var(--muted); font-size: 12.5px; }
.bar { position: relative; height: 22px; border-radius: 4px; background: var(--free-bg); border: 1px solid var(--free); overflow: hidden; }
.blk { position: absolute; top: 0; bottom: 0; background: var(--busy); border-inline: 1px solid var(--busy-line); }
.wins { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 8px; font-family: var(--font-mono); font-size: 12.5px; }
.wins span { color: var(--free); background: var(--free-bg); padding: 1px 8px; border-radius: 3px; }
.wins .none { color: var(--muted); background: transparent; padding: 0; }
.axis .ticks { grid-column: 2; }
.tzbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; font-size: 14px; }
.tzbar label { color: var(--muted); }
.tzbar select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; max-width: 100%; }
.tzbar select:focus-visible { outline: 2px solid var(--free); outline-offset: 2px; }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; max-width: 62ch; }
@media (max-width: 560px) {
  .axis { grid-template-columns: 1fr; }
  .axis .ticks { grid-column: 1; }
  .day { grid-template-columns: 1fr; row-gap: 8px; }
  .dlabel { flex-direction: row; gap: 8px; align-items: baseline; }
}
</style>
</head>
<body>


<div class="page">
  <header>
    <h1>Jeff Winters, availability</h1>
    <p class="sub">Open times over the next two weeks.</p>
    <div class="meta">
      <span>Updated Oct 7, 2026</span>
    </div>
  </header>

  <div class="tzbar">
    <label for="tz">Show times in</label>
    <select id="tz"></select>
  </div>

  <div class="legend">
    <span><i class="sw free"></i>Open</span>
    <span><i class="sw busy"></i>Busy</span>
  </div>

  <main id="weeks"></main>

  <footer>This is a read-only snapshot and may be out of date. Pick a window you like and send it back to the person who shared this page. Times are not held until confirmed.</footer>
</div>

<script>
// Busy blocks per day, in minutes after midnight, Central Time (America/Chicago). No titles on purpose.
var H = function (h, m) { return h * 60 + (m || 0); };
var DAYS = [{"d": "2026-10-07", "busy": [[615, 690], [750, 780]]}, {"d": "2026-10-08", "busy": [[600, 690], [840, 870]]}, {"d": "2026-10-09", "busy": [[615, 630], [660, 690], [780, 840]]}, {"d": "2026-10-12", "busy": [[585, 715], [900, 930]]}, {"d": "2026-10-13", "busy": [[615, 630], [660, 690], [900, 960]]}, {"d": "2026-10-14", "busy": [[615, 690], [720, 1020]]}, {"d": "2026-10-15", "busy": [[615, 690], [810, 840]]}, {"d": "2026-10-16", "busy": [[615, 630], [660, 690], [780, 840]]}, {"d": "2026-10-19", "busy": [[585, 715]]}, {"d": "2026-10-20", "busy": [[615, 630], [660, 690], [780, 840], [900, 960]]}, {"d": "2026-10-21", "busy": [[615, 690]]}];
var START = H(9), END = H(17), MIN_FREE = 30, SRC = "America/Chicago";
var ZONES = [
  ["America/New_York", "Eastern (New York)"], ["America/Chicago", "Central (Chicago)"],
  ["America/Denver", "Mountain (Denver)"], ["America/Phoenix", "Arizona (Phoenix)"],
  ["America/Los_Angeles", "Pacific (Los Angeles)"], ["America/Anchorage", "Alaska"],
  ["Pacific/Honolulu", "Hawaii"]
];
// Other US IANA names that devices report, mapped to the listed zone with the same clock.
var ALIAS = {
  "America/Detroit": "America/New_York", "America/Indiana/Indianapolis": "America/New_York",
  "America/Kentucky/Louisville": "America/New_York", "America/Boise": "America/Denver",
  "America/Menominee": "America/Chicago", "America/Juneau": "America/Anchorage",
  "US/Eastern": "America/New_York", "US/Central": "America/Chicago", "US/Mountain": "America/Denver",
  "US/Pacific": "America/Los_Angeles", "US/Arizona": "America/Phoenix", "US/Alaska": "America/Anchorage",
  "US/Hawaii": "Pacific/Honolulu"
};
var WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var zone = SRC;

function parts(ms, tz) {
  var o = {};
  new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric" })
    .formatToParts(new Date(ms)).forEach(function (p) { o[p.type] = +p.value; });
  return o;
}
// Central wall-clock (date + minutes) -> real instant in ms.
function srcToMs(iso, min) {
  var y = +iso.slice(0, 4), mo = +iso.slice(5, 7), d = +iso.slice(8, 10);
  var guess = Date.UTC(y, mo - 1, d, 0, min);
  var p = parts(guess, SRC);
  var off = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute) - guess;
  return guess - off;
}
// Instant -> clock text, date key and short weekday in the chosen zone.
function show(ms) {
  var p = parts(ms, zone), h = p.hour, ap = h >= 12 ? "PM" : "AM", h12 = h % 12 === 0 ? 12 : h % 12;
  var key = p.year + "-" + (p.month < 10 ? "0" : "") + p.month + "-" + (p.day < 10 ? "0" : "") + p.day;
  return { text: h12 + ":" + (p.minute < 10 ? "0" : "") + p.minute + " " + ap, key: key,
           wd: WD[new Date(Date.UTC(p.year, p.month - 1, p.day)).getUTCDay()].slice(0, 3) };
}
function freeWindows(busy) {
  var out = [], cur = START;
  busy.slice().sort(function (a, b) { return a[0] - b[0]; }).forEach(function (b) {
    if (b[0] - cur >= MIN_FREE) out.push([cur, b[0]]);
    if (b[1] > cur) cur = b[1];
  });
  if (END - cur >= MIN_FREE) out.push([cur, END]);
  return out;
}
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}
function ticks(iso) {
  var t = el("div", "ticks");
  [9, 11, 13, 15, 17].forEach(function (h) {
    var s = el("span", "", show(srcToMs(iso, H(h))).text.replace(":00", ""));
    s.style.left = ((H(h) - START) / (END - START) * 100) + "%";
    t.appendChild(s);
  });
  return t;
}
function weekOf(iso) {
  var d = new Date(iso + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return d.toISOString().slice(0, 10);
}
// Time label for a window edge, with a weekday tag when the day differs from the Central date.
function edge(iso, min) {
  var s = show(srcToMs(iso, min));
  return { text: s.text, shift: s.key !== iso ? s.wd : "" };
}

function render() {
  var groups = {}, order = [], root = document.getElementById("weeks");
  root.textContent = "";
  DAYS.forEach(function (day) {
    var k = weekOf(day.d);
    if (!groups[k]) { groups[k] = []; order.push(k); }
    groups[k].push(day);
  });
  order.forEach(function (k) {
    var wk = el("section", "week");
    var mon = new Date(k + "T12:00:00Z");
    wk.appendChild(el("h2", "", "Week of " + MO[mon.getUTCMonth()] + " " + mon.getUTCDate() + " (Central dates)"));
    var axis = el("div", "axis"); axis.appendChild(ticks(groups[k][0].d)); wk.appendChild(axis);
    var box = el("div", "days");
    groups[k].forEach(function (day) {
      var d = new Date(day.d + "T12:00:00Z");
      var row = el("div", "day");
      var lab = el("div", "dlabel");
      lab.appendChild(el("b", "", WD[d.getUTCDay()]));
      lab.appendChild(el("small", "", MO[d.getUTCMonth()] + " " + d.getUTCDate()));
      var right = el("div", "");
      var bar = el("div", "bar");
      day.busy.forEach(function (b) {
        var blk = el("div", "blk");
        blk.style.left = ((b[0] - START) / (END - START) * 100) + "%";
        blk.style.width = ((b[1] - b[0]) / (END - START) * 100) + "%";
        bar.appendChild(blk);
      });
      var wins = el("div", "wins");
      var fw = freeWindows(day.busy);
      if (!fw.length) wins.appendChild(el("span", "none", "No open time"));
      fw.forEach(function (w) {
        var a = edge(day.d, w[0]), b = edge(day.d, w[1]);
        wins.appendChild(el("span", "", a.text + (a.shift ? " " + a.shift : "") + " to " + b.text + (b.shift ? " " + b.shift : "")));
      });
      right.appendChild(bar); right.appendChild(wins);
      row.appendChild(lab); row.appendChild(right);
      box.appendChild(row);
    });
    wk.appendChild(box);
    root.appendChild(wk);
  });
}

function init() {
  var sel = document.getElementById("tz"), detected = "", saved = "";
  try { detected = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
  try { saved = localStorage.getItem("avail-tz") || ""; } catch (e) {}
  var list = ZONES.slice();
  var known = function (z) { return list.some(function (x) { return x[0] === z; }); };
  if (ALIAS[detected]) detected = ALIAS[detected];
  list.forEach(function (z) { var o = el("option", "", z[1]); o.value = z[0]; sel.appendChild(o); });
  var pick = saved && known(saved) ? saved : (detected && known(detected) ? detected : SRC);
  try { new Intl.DateTimeFormat("en-US", { timeZone: pick }); } catch (e) { pick = SRC; }
  zone = pick; sel.value = pick;
  sel.addEventListener("change", function () {
    zone = sel.value;
    try { localStorage.setItem("avail-tz", zone); } catch (e) {}
    render();
  });
  render();
}
if (typeof document !== "undefined" && document.getElementById("tz")) init();
</script>

</body>
</html>
